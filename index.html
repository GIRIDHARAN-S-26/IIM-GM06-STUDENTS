<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IIM Visakhapatnam — GM-06 Cohort Directory</title>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  
  <style>
    :root {
      --primary-gold: #f59e0b;
      --gold-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      --gold-glow: rgba(245, 158, 11, 0.25);
      --bg-dark: #070d19;
      --card-bg: rgba(18, 28, 51, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(245, 158, 11, 0.5);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --linkedin-blue: #0077b5;
      --linkedin-hover: #005885;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(10, 102, 194, 0.05) 0%, transparent 40%);
      color: var(--text-main);
      padding: 32px 20px;
      min-height: 100vh;
    }

    .container { max-width: 1240px; margin: 0 auto; }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 36px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .batch-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      border-radius: 20px;
      margin-bottom: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(245, 158, 11, 0.35);
      border: 2px solid rgba(245, 158, 11, 0.4);
      transition: transform 0.3s ease;
      background-color: #0b1329;
    }

    .batch-logo:hover {
      transform: scale(1.05);
    }

    .badge-iimv {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--primary-gold);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* Input Section */
    .card-box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      transition: all 0.3s;
    }

    .card-box h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-box h3 i { color: #0a66c2; }

    textarea {
      width: 100%;
      padding: 14px;
      background: rgba(7, 13, 25, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.88rem;
      resize: vertical;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    textarea:focus { outline: none; border-color: var(--primary-gold); }

    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-gold {
      background: var(--gold-gradient);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px var(--gold-glow);
    }

    .btn-gold:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }

    /* Alphabet Filter Bar */
    .alphabet-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 24px;
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .alpha-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.82rem;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .alpha-btn:hover, .alpha-btn.active {
      background: var(--gold-gradient);
      color: #000;
    }

    /* Toolbar Section */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      background: var(--card-bg);
      padding: 16px 22px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      background: rgba(7, 13, 25, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .search-box input:focus { outline: none; border-color: var(--primary-gold); }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .stats-badge {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--primary-gold);
      background: rgba(245, 158, 11, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .actions-bar { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-secondary:hover { background: rgba(255,255,255,0.12); }

    /* Directory Cards */
    .directory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .member-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .member-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--gold-gradient);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .member-card:hover {
      transform: translateY(-4px);
      border-color: var(--card-border-hover);
      box-shadow: 0 12px 25px rgba(0,0,0,0.4);
    }

    .member-card:hover::before { opacity: 1; }

    .card-header-flex {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .avatar-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--gold-gradient);
      color: #000;
      font-weight: 800;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px var(--gold-glow);
    }

    .member-info h4 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    .member-info p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid var(--card-border);
    }

    .linkedin-btn {
      background: var(--linkedin-blue);
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .linkedin-btn:hover { background: var(--linkedin-hover); }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="IIM-GM06_2.jpg" 
           onerror="if (this.src.indexOf('IIM-GM06.jpg') === -1) { this.src='IIM-GM06.jpg'; } else { this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 200 200\'><rect width=\'200\' height=\'200\' rx=\'25\' fill=\'%230b1329\'/><path d=\'M100 35 L160 55 V110 C160 145 100 170 100 170 C100 170 40 145 40 110 V55 Z\' fill=\'%23121c33\' stroke=\'%23f59e0b\' stroke-width=\'4\'/><text x=\'100\' y=\'80\' fill=\'%23f59e0b\' font-size=\'10\' font-family=\'sans-serif\' font-weight=\'bold\' text-anchor=\'middle\'>IIM VISAKHAPATNAM</text><text x=\'100\' y=\'110\' fill=\'%23ffffff\' font-size=\'22\' font-family=\'sans-serif\' font-weight=\'900\' text-anchor=\'middle\'>GM-06</text><text x=\'100\' y=\'130\' fill=\'%23f59e0b\' font-size=\'14\' font-family=\'sans-serif\' font-weight=\'bold\' text-anchor=\'middle\'>STUDENTS</text></svg>'; }" 
           alt="IIM Visakhapatnam GM-06 Logo" 
           class="batch-logo" />
      
      <div class="badge-iimv"><i class="fa-solid fa-shield-halved"></i> Executive Education</div>
      <h1>IIM VISAKHAPATNAM</h1>
      <p>Executive Post Graduate Certificate Program in General Management — Batch GM-06</p>
    </header>

    <!-- LinkedIn Links & JSON Upload Section -->
    <div class="card-box">
      <h3><i class="fa-brands fa-linkedin"></i> LinkedIn Profiles link</h3>
      <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 12px;">
        Paste raw LinkedIn Profile URLs here to dynamically add members to Google Sheet:
      </p>
      <textarea id="bulkLinks" rows="4" placeholder="https://www.linkedin.com/in/profile-id..."></textarea>
      
      <div class="btn-group">
        <button onclick="importLinkedInLinks()" class="btn-gold" id="btnProcess"><i class="fa-solid fa-bolt"></i> Process Profiles</button>
        <button onclick="triggerJsonUpload()" class="btn-secondary"><i class="fa-solid fa-file-import"></i> Upload JSON File</button>
        <input type="file" id="jsonFileInput" accept=".json" style="display: none;" onchange="handleJsonUpload(event)" />
      </div>
    </div>

    <!-- Alphabet Filter Bar -->
    <div class="alphabet-bar" id="alphabetBar"></div>

    <!-- Directory Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" oninput="renderDirectory()" placeholder="Search by name or position..." />
      </div>

      <div class="stats-badge" id="studentCount">Connecting to Google Sheet...</div>

      <div class="actions-bar">
        <button onclick="exportData()" class="btn-secondary" title="Export Backup File"><i class="fa-solid fa-download"></i> Export JSON</button>
      </div>
    </div>

    <!-- Cohort Cards Grid -->
    <div id="directoryGrid" class="directory-grid"></div>
  </div>

  <script>
    let activeLetter = "ALL";
    let loadedStudents = [];

    // YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxFpzApynrpeqpm2Nex17WvMS0yqEKIRjICkBH8SmVph6G03-ZlchybZbij3kI41NI/exec";

    // Fetch live cohort data directly from Google Sheet
    async function loadDataFromSheet() {
      try {
        const response = await fetch(GOOGLE_SHEET_API_URL);
        const data = await response.json();
        if (Array.isArray(data) && data.length > 0) {
          loadedStudents = data.map(s => ({ ...s, position: "GM-06 Participant" }));
          localStorage.setItem("iimv_gm06_pro", JSON.stringify(loadedStudents));
          return loadedStudents;
        }
      } catch (err) {
        console.error("Failed to load from Google Sheet, loading cached local data:", err);
      }
      return getLocalStudents();
    }

    function getLocalStudents() {
      const stored = localStorage.getItem("iimv_gm06_pro");
      return stored ? JSON.parse(stored) : [];
    }

    async function sendDataToSheet(newItems) {
      try {
        await fetch(GOOGLE_SHEET_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(newItems)
        });
      } catch (err) {
        console.error("Error saving to Google Sheet:", err);
      }
    }

    // Clean URL Parser
    function parseLinkedInURL(url) {
      let cleanUrl = url.trim();
      if (!cleanUrl.startsWith("http")) cleanUrl = "https://" + cleanUrl;

      let match = cleanUrl.match(/linkedin\.com\/in\/([^\/\?]+)/i);
      let name = "GM-06 Member";
      let position = "GM-06 Participant";

      if (match && match[1]) {
        let slugParts = match[1].split("-").filter(p => p.length > 0);
        let nameWords = [];
        for (let part of slugParts) {
          if (/^[a-f0-9]{7,}$/i.test(part) || /^\d+$/.test(part)) continue;
          nameWords.push(part.charAt(0).toUpperCase() + part.slice(1));
        }

        if (nameWords.length >= 1) {
          name = nameWords.slice(0, 2).join(" ");
        }
      }

      return { name, position, linkedin: cleanUrl };
    }

    async function importLinkedInLinks() {
      const text = document.getElementById("bulkLinks").value.trim();
      if (!text) return;

      const btn = document.getElementById("btnProcess");
      btn.innerText = "Processing & Syncing...";
      btn.disabled = true;

      const urlRegex = /(https?:\/\/(?:www\.)?linkedin\.com\/in\/[^\s\n,]+|www\.linkedin\.com\/in\/[^\s\n,]+|linkedin\.com\/in\/[^\s\n,]+)/gi;
      const foundUrls = text.match(urlRegex);

      if (!foundUrls || foundUrls.length === 0) {
        alert("No valid LinkedIn URLs detected.");
        btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Process Profiles';
        btn.disabled = false;
        return;
      }

      const students = loadedStudents;
      let newItems = [];

      foundUrls.forEach(url => {
        let parsed = parseLinkedInURL(url);
        if (!students.some(s => s.linkedin.toLowerCase() === parsed.linkedin.toLowerCase())) {
          let item = {
            id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
            name: parsed.name,
            position: "GM-06 Participant",
            linkedin: parsed.linkedin
          };
          students.push(item);
          newItems.push(item);
        }
      });

      if (newItems.length > 0) {
        // Save locally for instant rendering
        localStorage.setItem("iimv_gm06_pro", JSON.stringify(students));
        
        // Sync to Google Sheet database
        await sendDataToSheet(newItems);
        
        document.getElementById("bulkLinks").value = "";
        alert(`Successfully added ${newItems.length} new profile(s) to the Google Sheet!`);
        renderAlphabetBar();
        renderDirectory();
      } else {
        alert("Profiles are already present in the directory.");
      }

      btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Process Profiles';
      btn.disabled = false;
    }

    function triggerJsonUpload() {
      document.getElementById("jsonFileInput").click();
    }

    async function handleJsonUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (!Array.isArray(importedData)) {
            alert("Invalid JSON format.");
            return;
          }

          const students = loadedStudents;
          let newItems = [];

          importedData.forEach(item => {
            if (item.name && item.linkedin) {
              if (!students.some(s => s.linkedin.toLowerCase() === item.linkedin.toLowerCase())) {
                let newItem = {
                  id: item.id || (Date.now().toString() + Math.random().toString(36).substr(2, 4)),
                  name: item.name,
                  position: "GM-06 Participant",
                  linkedin: item.linkedin.startsWith("http") ? item.linkedin : "https://" + item.linkedin
                };
                students.push(newItem);
                newItems.push(newItem);
              }
            }
          });

          if (newItems.length > 0) {
            localStorage.setItem("iimv_gm06_pro", JSON.stringify(students));
            await sendDataToSheet(newItems);
            alert(`Successfully imported and synced ${newItems.length} profile(s) to Google Sheet!`);
            renderAlphabetBar();
            renderDirectory();
          } else {
            alert("All profiles in the file are already present.");
          }
        } catch (err) {
          alert("Error reading JSON file.");
        }
        event.target.value = "";
      };

      reader.readAsText(file);
    }

    function getInitials(name) {
      let parts = name.split(" ");
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return name.slice(0, 2).toUpperCase();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(loadedStudents, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "iimv_gm06_directory.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function renderAlphabetBar() {
      const letters = ["ALL", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")];
      const bar = document.getElementById("alphabetBar");
      
      bar.innerHTML = letters.map(letter => `
        <button onclick="setLetterFilter('${letter}')" class="alpha-btn ${activeLetter === letter ? 'active' : ''}">
          ${letter}
        </button>
      `).join("");
    }

    function setLetterFilter(letter) {
      activeLetter = letter;
      renderAlphabetBar();
      renderDirectory();
    }

    function renderDirectory() {
      const grid = document.getElementById("directoryGrid");
      const query = document.getElementById("searchInput").value.toLowerCase();
      let students = loadedStudents;

      students.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));

      if (activeLetter !== "ALL") {
        students = students.filter(s => s.name.toUpperCase().startsWith(activeLetter));
      }

      if (query) {
        students = students.filter(s => 
          s.name.toLowerCase().includes(query) || 
          s.position.toLowerCase().includes(query)
        );
      }

      document.getElementById("studentCount").innerText = `${students.length} GM-06 Members`;

      if (students.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-graduation-cap" style="font-size: 2.5rem; margin-bottom: 12px; color: var(--card-border);"></i>
            <p>No profiles match your filter or search query.</p>
          </div>`;
        return;
      }

      grid.innerHTML = students.map(s => `
        <div class="member-card">
          <div>
            <div class="card-header-flex">
              <div class="avatar-circle">${getInitials(s.name)}</div>
              <div class="member-info">
                <h4>${escapeHtml(s.name)}</h4>
                <p>GM-06 Participant</p>
              </div>
            </div>
          </div>
          <div class="card-footer">
            <a href="${escapeHtml(s.linkedin)}" target="_blank" rel="noopener noreferrer" class="linkedin-btn">
              <i class="fa-brands fa-linkedin"></i> LinkedIn Profile
            </a>
          </div>
        </div>
      `).join("");
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    document.addEventListener("DOMContentLoaded", async () => {
      renderAlphabetBar();
      await loadDataFromSheet();
      renderDirectory();
    });
  </script>
</body>
</html>
